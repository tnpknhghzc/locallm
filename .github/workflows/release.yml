name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: make test   # быстрые тесты без llama.cpp

  build:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-amd64 }
          - { os: macos-14,       name: darwin-arm64 }
          - { os: macos-13,       name: darwin-amd64 }
          - { os: windows-latest, name: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows-latest'
        with:
          msystem: MINGW64
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-go
      - uses: actions/setup-go@v5
        if: matrix.os != 'windows-latest'
        with: { go-version: "1.25" }
      - name: llama.cpp (статические библиотеки)
        run: make deps
      - name: Сборка
        run: make build VERSION=${{ github.ref_name }}
      - name: Проверка с настоящим llama.cpp (крошечные модели)
        run: make test-real
      - name: Модели и бандл «один файл»
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          WITH_1_5B=1 ./scripts/fetch-models.sh models
          make bundle LLM=models/qwen2.5-1.5b-instruct-q4_k_m.gguf EMBED=models/Qwen3-Embedding-0.6B-Q8_0.gguf
      - name: Упаковка
        run: |
          mkdir -p dist
          for f in bin/*; do
            b=$(basename "$f"); ext=""
            case "$b" in *.exe) ext=.exe; b="${b%.exe}";; esac
            cp "$f" "dist/$b-${{ matrix.name }}$ext"
          done
      - uses: actions/upload-artifact@v4
        with: { name: "locallm-${{ matrix.name }}", path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
